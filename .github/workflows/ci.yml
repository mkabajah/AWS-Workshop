name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lambda unit tests and lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  cloudformation:
    name: Lint CloudFormation templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install cfn-lint
      - run: cfn-lint

  cdk:
    name: Synthesize every CDK stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: cdk/requirements.txt
      - uses: actions/setup-node@v4 # the cdk command-line tool runs on Node.js
        with:
          node-version: 22
      - run: pip install -r requirements.txt
        working-directory: cdk
      - run: npm install --no-audit --no-fund
        working-directory: cdk
      - run: npx cdk synth --quiet -c email=ci@example.com
        working-directory: cdk
